<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>

<div class="container">

    <a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

    <h2>📋 Mark Attendance</h2>

    <!-- Course & Date (UI only) -->
    <div class="filter-box">
        <label>Course:</label>
        <select>
            <option>Python (CSE - A)</option>
            <option>DBMS (CSE - A)</option>
        </select>

        <label>Date:</label>
        <input type="date">

        <button>Load Students</button>
    </div>

    <!-- Attendance Table -->
    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Present</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Student 1</td>
            <td><input type="checkbox"></td>
        </tr>

        <tr>
            <td>102</td>
            <td>Student 2</td>
            <td><input type="checkbox"></td>
        </tr>

        <tr>
            <td>103</td>
            <td>Student 3</td>
            <td><input type="checkbox"></td>
        </tr>

    </table>

    <button class="save-btn">💾 Save Attendance</button>

</div>

</body>
</html>
